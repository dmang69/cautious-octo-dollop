set timeout=5
set default=0

# IntentKernel demo ISO — minimal GRUB menu.
# Full Linux live boot requires a kernel+initrd pair; this image ships
# staged binaries under /IntentKernel and docs under /live/intentkernel.
# Run the demo stack manually or from a host that mounts the ISO:
#   /live/intentkernel/autorun.sh

menuentry "IntentKernel Live Demo (info)" {
    echo "IntentKernel AI OS demo ISO"
    echo "Staged binaries: /IntentKernel/bin"
    echo "Autorun script:  /live/intentkernel/autorun.sh"
    echo ""
    echo "Mount this ISO and run autorun.sh to start:"
    echo "  ai-runtime, intent-verifier, intentd"
    sleep 5
}

menuentry "IntentKernel — shell (if booted into Linux)" {
    # When a host Linux environment mounts this ISO at /cdrom:
    if [ -f /cdrom/live/intentkernel/autorun.sh ]; then
        set root=(cd0)
        linux /live/vmlinuz quiet
        initrd /live/initrd.img
    else
        echo "No live kernel bundled — use autorun.sh from mounted ISO"
        sleep 3
    fi
}

menuentry "IntentKernel — autorun only (no kernel)" {
    echo "After mounting ISO:"
    echo "  sudo mount /dev/sr0 /mnt && /mnt/live/intentkernel/autorun.sh"
    sleep 5
}