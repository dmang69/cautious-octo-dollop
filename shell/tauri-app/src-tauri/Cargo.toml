[package]
name = "ai-os-shell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
ipc = { path = "../../../core/ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
