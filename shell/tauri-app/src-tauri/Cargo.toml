[workspace]
resolver = "2"
members = ["."]

[package]
name = "intentkernel-shell"
version = "0.1.0"
edition = "2021"
description = "IntentKernel desktop shell"
build = "build.rs"

[lib]
name = "intentkernel_shell_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
prost = "0.13"
intentkernel-core = { path = "../../../kernel/intentkernel-core" }
intentkernel-crypto = { path = "../../../crypto/intentkernel-crypto" }
intentkernel-util = { path = "../../../utilities/intentkernel-util" }
hex = "0.4"