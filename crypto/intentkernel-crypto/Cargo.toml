[package]
name = "intentkernel-crypto"
version.workspace = true
edition.workspace = true
description = "RFC-INTENT-001 capability token cryptography"

[features]
default = ["ed25519"]
ed25519 = ["dep:ed25519-dalek", "dep:rand"]
pqc = ["dep:pqcrypto-mldsa", "dep:pqcrypto-traits", "dep:rand"]

[dependencies]
anyhow = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
intentkernel-util = { path = "../../utilities/intentkernel-util" }
minicbor = { version = "2.2", features = ["alloc", "std"] }
pqcrypto-mldsa = { version = "0.1", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }
rand = { version = "0.8", optional = true }
serde = { workspace = true }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hex = "0.4"