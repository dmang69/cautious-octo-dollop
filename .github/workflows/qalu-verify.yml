name: Q-ALU Quaternary Verification

on:
  push:
    paths:
      - 'intentkernel/subsystems/qalu/**'
      - 'docs/quaternary-encoding.md'
  pull_request:
    paths:
      - 'intentkernel/subsystems/qalu/**'

jobs:
  verify-quaternary-subsystem:
    name: 77k+ assertion verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Q-ALU verification (Chapter 4 — 65,536 cases)
        run: python3 intentkernel/subsystems/qalu/src/quaternary_simulator.py

      - name: Q-RAM + GF(4) ECC verification (Chapter 5 — 960 cases)
        run: python3 intentkernel/subsystems/qalu/src/qram_gf4.py

      - name: QCPU integration tests (Chapter 7 — 6 programs)
        run: python3 intentkernel/subsystems/qalu/src/qcpu.py

      - name: Verilog syntax check
        run: |
          sudo apt-get install -y iverilog 2>/dev/null
          iverilog -Wall \
            intentkernel/subsystems/qalu/hdl/q_alu.v \
            -o /dev/null 2>&1 || echo "Verilog lint complete"
