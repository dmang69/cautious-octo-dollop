name: Q-ALU Verification Suite

on:
  push:
    paths:
      - 'subsystems/qalu/**'
      - 'daemons/capd/src/qalu_cap.rs'
  pull_request:

jobs:
  quaternary-verification:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Q-ALU verification (Chapter 4)
        run: python3 subsystems/qalu/src/qalu.py

      - name: Run Q-RAM + GF(4) ECC verification (Chapter 5)
        run: python3 subsystems/qalu/src/qram_gf4.py

      - name: Run QCPU integration tests (Chapter 7)
        run: python3 subsystems/qalu/src/qcpu.py

      - name: Verilog lint check (optional — requires iverilog)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -Wall subsystems/qalu/hdl/q_alu.v -o /dev/null
        continue-on-error: true
